services:
  # Install pure-JavaScript dependencies into a shared volume, not a custom image.
  dependencies:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["npm", "ci", "--omit=dev", "--ignore-scripts", "--no-audit", "--no-fund"]
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - node_modules:/app/node_modules
  app:
    image: node:24-bookworm-slim
    user: node
    working_dir: /app
    command: ["node", "server.js"]
    depends_on:
      dependencies:
        condition: service_completed_successfully
    volumes:
      - ./package.json:/app/package.json:ro
      - ./server.js:/app/server.js:ro
      - ./web:/app/web:ro
      - node_modules:/app/node_modules:ro
    restart: unless-stopped
    environment:
      STREAMROOM_BIND: 0.0.0.0:8787
    expose:
      - "8787"
    read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  node_modules:
  caddy_data:
  caddy_config:
